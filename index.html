 why:"75%酒精並非對所有無套膜病毒都同樣有效",
 check:"菌株名稱、測試濃度、作用時間與降幅，不能只看「99.9%」",
 avoid:"把「抗病毒」視為對所有病毒有效"},

{need:"想避開酒精味或易燃性",

 brands:"黃金盾07、淨淨、OHTrust、次綠康、寶護、旺旺水神、白因子",
 why:"避開高酒精配方的氣味與易燃注意事項",
 check:"無酒精不代表零刺激、可飲用或可直接噴入口用品",
 avoid:"把VirusBom寫成完全無酒精"},

{need:"需要含酒精、噴後擦拭的玩具用品方案",
 pick:"中低濃度酒精＋產品指定擦拭流程",
 brands:"MOTHER-K DIA；貝恩神隊友也可比較但配方與用途不同",
 why:"適合偏好清楚「噴後擦拭」流程的家庭",
 check:"火源、通風、材質掉色／塗層、不可噴人體或食物",
 avoid:"用酒精產品處理皮革、塗層或不耐酒精材質"},

{need:"寶寶會直接舔咬或物品會盛裝食物",
 pick:"用途明確的入口／食器清潔消毒方式",
 brands:"先看用品原廠與產品當前SKU，不按品牌一概推薦",
 why:"入口風險高，必須以具體標示與沖洗要求判斷",

];

function badgeClass(a){ return a==="green"?"b-green":a==="red"?"b-red":"b-yellow"; }

function renderCompare(){
  const el = document.getElementById("compare");
  el.innerHTML = '<p class="sec-note">點卡片展開詳情；顏色代表酒精標示：<span class="badge b-green">無酒精</span> <span class="badge b-yellow">微量</span> <span class="badge b-red">含酒精</span></p>'
    + products.map(p => `
    <details class="card">
      <summary>
        <span class="name">${p.name}</span>
        <span class="chev">▶</span>
      </summary>
      <div class="badges">
        <span class="badge ${badgeClass(p.alcohol)}">${p.alcoholLabel}</span>
        ${p.tags.map(t=>`<span class="badge b-grey">${t}</span>`).join("")}
      </div>
      <div class="row"><span class="label">主要成分</span>${p.type}</div>
      <div class="row"><span class="label">主要特色</span>${p.feature}</div>
      <div class="row"><span class="label">檢測重點</span>${p.test}</div>
      <div class="row"><span class="label">適合情境</span>${p.use}</div>
      <div class="row"><span class="label">注意事項</span>${p.caution}</div>
      <div class="row"><span class="label">資料來源</span><a class="src" href="${p.src}" target="_blank" rel="noopener">${p.src}</a></div>
    </details>
  `).join("");
}

function renderUsage(){
  const el = document.getElementById("usage");
  el.innerHTML = '<p class="sec-note">先看物品是否會入口，再看產品標示；清潔髒污和遵守接觸時間同樣重要。</p>'
    + usageItems.map(u => `
    <details class="card">
      <summary>
        <span class="name">${u.item}</span>
        <span class="chev">▶</span>
      </summary>
      <div class="badges"><span class="badge b-blue">${u.conclude}</span></div>
      <div class="row"><span class="label">先判斷</span>${u.judge}</div>
      <div class="row"><span class="label">建議原則</span>${u.rule}</div>
      <div class="row"><span class="label">可考慮類型</span>${u.type}</div>
      <div class="row"><span class="label">使用後</span>${u.after}</div>
      <div class="row"><span class="label">避免事項</span>${u.avoid}</div>
    </details>
  `).join("");
}

function renderChoose(){
  const el = document.getElementById("choose");
  el.innerHTML = '<p class="sec-note">從需求出發，再回到當前SKU的標示、菌株、濃度、接觸時間與使用方法。</p>'
    + chooseItems.map(c => `
    <details class="card">
      <summary>
        <span class="need-title" style="flex:1">${c.need}</span>
        <span class="chev">▶</span>
      </summary>
      <div class="row"><span class="label">優先看哪一類</span>${c.pick}</div>
      <div class="row"><span class="label">可先比較品牌</span>${c.brands}</div>
      <div class="row"><span class="label">為什麼</span>${c.why}</div>
      <div class="row"><span class="label">一定要再確認</span>${c.check}</div>
      <div class="row"><span class="label">不建議這樣選</span>${c.avoid}</div>
    </details>
  `).join("");
}

renderCompare(); renderUsage(); renderChoose();

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll("section.view").forEach(s=>s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
    window.scrollTo({top:0, behavior:"instant"});
  });
});
</script>
